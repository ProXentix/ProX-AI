# Neurix-100M Canonical Production Training Configuration

model:
  name: neurix-100m
  vocab_size: 32000
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_ff: 1720
  max_seq_len: 2048
  tie_weights: true

data:
  train_dataset: ./data/train.jsonl
  val_dataset: ./data/valid.jsonl
  seq_len: 2048
  val_ratio: 0.05
  num_workers: 4

optimizer:
  name: AdamW
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8

scheduler:
  type: cosine
  warmup_steps: 2000
  min_lr_ratio: 0.1

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  max_steps: 50000
  gradient_clip: 1.0
  precision: auto  # auto, float16, bfloat16, float32
  seed: 42

checkpoint:
  save_every: 1000
  output_dir: ./weights/neurix_100m_pretrain

evaluation:
  eval_every: 500
  eval_steps: 50

logging:
  log_every: 10
  tensorboard: false

reproducibility:
  seed: 42
  deterministic: true
