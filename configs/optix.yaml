model:
  name: optix
  vocab_size: 32000
  d_model: 768
  n_layers: 8
  n_heads: 8
  d_ff: 2048
  max_seq_len: 1024
  tie_weights: true
  status: experimental_not_trained

training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 100
  max_steps: 2000
  gradient_clip: 1.0
  precision: auto
  seed: 42

checkpoint:
  save_every: 200
  output_dir: ./weights/optix
