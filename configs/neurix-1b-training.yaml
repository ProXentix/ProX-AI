# Neurix-1B Canonical Production Training Configuration

model:
  name: neurix-1b
  vocab_size: 32000
  d_model: 1792
  n_layers: 24
  n_heads: 14
  d_ff: 4800
  max_seq_len: 4096
  tie_weights: true

data:
  train_dataset: prox_training_corpus/train
  val_dataset: prox_training_corpus/validation
  seq_len: 4096
  val_ratio: 0.05
  num_workers: 4

optimizer:
  name: AdamW
  learning_rate: 2.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8

scheduler:
  type: cosine
  warmup_steps: 4000
  min_lr_ratio: 0.1

training:
  batch_size: 1
  gradient_accumulation_steps: 32
  max_steps: 100000
  gradient_clip: 1.0
  precision: bfloat16
  seed: 42

checkpoint:
  save_every: 2000
  output_dir: ./weights/neurix_1b_pretrain

evaluation:
  eval_every: 1000
  eval_steps: 100

logging:
  log_every: 10
  tensorboard: false

reproducibility:
  seed: 42
  deterministic: true
