model:
  name: neurix-100m
  vocab_size: 32000
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_ff: 1720
  max_seq_len: 512
  tie_weights: true

training:
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 5
  max_steps: 10
  gradient_clip: 1.0
  precision: float32
  seed: 42

checkpoint:
  save_every: 5
  output_dir: ./weights/neurix_100m_cpu_dev
